name: Build macOS Universal

on:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pyinstaller

      - run: pyinstaller server.spec --distpath dist

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - name: Collect arm64 binaries
        run: |
          mkdir -p artifacts/arm64
          cp dist/server artifacts/arm64/server
          cp node_modules/ffmpeg-static/ffmpeg artifacts/arm64/ffmpeg
          cp node_modules/ffprobe-static/bin/darwin/arm64/ffprobe artifacts/arm64/ffprobe

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-arm64
          path: artifacts/arm64/

  build-x64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pyinstaller

      - run: pyinstaller server.spec --distpath dist
        env:
          TARGET_ARCH: x86_64

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci
        env:
          npm_config_arch: x64

      - name: Collect x64 binaries
        run: |
          mkdir -p artifacts/x64
          cp dist/server artifacts/x64/server
          cp node_modules/ffmpeg-static/ffmpeg artifacts/x64/ffmpeg
          cp node_modules/ffprobe-static/bin/darwin/x64/ffprobe artifacts/x64/ffprobe

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-x64
          path: artifacts/x64/

  build-universal:
    needs: [build-arm64, build-x64]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: binaries-arm64
          path: artifacts/arm64

      - uses: actions/download-artifact@v4
        with:
          name: binaries-x64
          path: artifacts/x64

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - run: npm install --save-dev @electron/universal

      - name: Build arm64 app (unpacked)
        run: |
          mkdir -p dist
          chmod +x artifacts/arm64/server artifacts/arm64/ffmpeg artifacts/x64/ffprobe
          cp artifacts/arm64/server dist/server
          cp artifacts/arm64/ffmpeg node_modules/ffmpeg-static/ffmpeg
          cp artifacts/x64/ffprobe node_modules/ffprobe-static/bin/darwin/arm64/ffprobe
          npx electron-builder --mac --arm64 --dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build x64 app (unpacked)
        run: |
          chmod +x artifacts/x64/server artifacts/x64/ffmpeg
          cp artifacts/x64/server dist/server
          cp artifacts/x64/ffmpeg node_modules/ffmpeg-static/ffmpeg
          npx electron-builder --mac --x64 --dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Merge into universal app
        run: |
          mkdir -p dist/mac-universal
          node -e "
          const { makeUniversalApp } = require('@electron/universal');
          makeUniversalApp({
            x64AppPath: 'dist/mac-x64/Video Compressor.app',
            arm64AppPath: 'dist/mac-arm64/Video Compressor.app',
            outAppPath: 'dist/mac-universal/Video Compressor.app',
            x64ArchFiles: '**/bin/ffprobe',
          }).then(() => console.log('Done')).catch(e => { console.error(e); process.exit(1); });
          "

      - name: Package universal app into DMG
        run: npx electron-builder --prepackaged "dist/mac-universal/Video Compressor.app" --mac dmg
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: Video-Compressor-universal
          path: dist/*.dmg
