name: Build macOS x64 (Intel)

on:
  workflow_dispatch:

jobs:
  build-x64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pyinstaller

      - name: Build x64 server binary
        run: pyinstaller server.spec --distpath dist
        env:
          TARGET_ARCH: x86_64

      - name: Verify server arch
        run: file dist/server

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - name: Force x64 ffmpeg download
        run: |
          rm -f node_modules/ffmpeg-static/ffmpeg
          node node_modules/ffmpeg-static/install.js
          file node_modules/ffmpeg-static/ffmpeg
        env:
          npm_config_arch: x64
          npm_config_platform: darwin

      - name: Build x64 app
        run: npx electron-builder --mac --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: Video-Compressor-x64
          path: dist/*.dmg
